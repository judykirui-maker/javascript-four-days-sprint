<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 3 - Interactive Task Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>My Task Manager</h1>
    <h2>Day 3: Interactive Browser Task Manager</h2>
    <p id="message" role="status" aria-live="polite">
      Welcome! Let's manage our tasks.
    </p>
    <button type="button" id="change-message-btn">Click Me</button>
  </header>

  <main>
    <form id="task-form">
      <label for="task-input">Enter a task:</label>
      <input type="text" id="task-input" name="title" maxlength="80" required>
      <p id="task-error" role="alert" aria-live="polite"></p>
      <button type="submit">Add Task</button>
    </form>

    <section aria-label="Task filters">
      <label for="search-input">Search tasks:</label>
      <input type="search" id="search-input" placeholder="Search tasks">

      <label for="status-filter">Filter tasks:</label>
      <select id="status-filter">
        <option value="all">All</option>
        <option value="open">Open</option>
        <option value="completed">Completed</option>
      </select>
    </section>

    <p id="storage-message" role="status" aria-live="polite"></p>

    <section aria-label="Your tasks">
      <ul id="task-list"></ul>
    </section>
  </main>
</body>
</html>
